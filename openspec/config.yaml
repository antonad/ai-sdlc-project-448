schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: browser-only access policy simulator (React 19, Mantine, TypeScript, Vite, Vitest).
  Customer: Marina, access administrator. The app runs on training data and manages no real services.
  Before proposing or designing a change read CLAUDE.md, docs/architecture.md and
  docs/security-requirements.md. Every change must respect the four security requirements
  and the three architecture rules (single access module, explicit time `at`,
  components reach configuration only through src/app).
  Verify a finished change with the `verify` skill and review it with `review-diff`.

rules:
  proposal:
    - State what is out of scope
    - Name which security requirements and architecture rules the change touches
  design:
    - Say in which layer (domain, app, components) the new logic lives and why
  tasks:
    - Each task that adds behavior includes its test
    - Final task runs npm test, npm run lint, npm run lint:arch and npm run build

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
